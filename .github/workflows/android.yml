name: Android APK

# Builds the APK on every push to main (and on demand) and publishes it as a GitHub Release.
# The app checks the latest release for updates (tag build-<N>, N = versionCode).
on:
  push:
    branches: [main, android-apk]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install and sync web assets
        run: |
          npm ci
          npm run www
          npx cap sync android

      # Optional: use your own signing key from repository secrets instead of the key in android/keystore.
      # Keep the SAME key forever - Android refuses to update an app signed with a different key.
      - name: Decode keystore (if provided)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/omer-app.apk
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" dist/omer-app.apk \
            --target "${{ github.sha }}" \
            --title "ספירת העומר — build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}. Download omer-app.apk, or open the app and use Settings → Check for update." \
            --latest

      - name: Keep the APK as a build artifact too
        uses: actions/upload-artifact@v4
        with:
          name: omer-app-apk
          path: dist/omer-app.apk
